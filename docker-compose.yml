version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: CryptoPulse_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: CryptoPulse_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./backend:/app  # <-- Ось це робить Live Sync твого коду з Docker

# Це має бути притиснуто до самого лівого краю (без пробілів)
volumes:
  pgdata: