<svg width="327" height="287" viewBox="0 0 327 287" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="proBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2C1969"/>
      <stop offset="52%" stop-color="#8348C1"/>
      <stop offset="100%" stop-color="#C38BFF"/>
    </linearGradient>
    <linearGradient id="proBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8348C1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#B3B3B3" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8348C1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8348C1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8348C1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badgeBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#8348C1"/>
      <stop offset="100%" stop-color="#2C1969"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="327" height="287" rx="0" fill="#000008"/>

  <!-- Badge "ВАРТІСТЬ" -->
  <rect x="110" y="8" width="107" height="22" rx="11" fill="#0D0D14"/>
  <rect x="110.4" y="8.4" width="106.2" height="21.2" rx="10.6" stroke="url(#badgeBorder)" stroke-width="0.8"/>
  <circle cx="123" cy="19" r="3" fill="white"/>
  <text x="131" y="23.5" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="700" fill="#8348C1" letter-spacing="0.8">ВАРТІСТЬ</text>

  <!-- Heading line 1 -->
  <text x="163" y="50" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">Знайдіть план, який відповідає</text>
  <!-- Heading line 2 -->
  <text x="163" y="63" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">вашим потребам</text>

  <!-- Toggle pill background -->
  <rect x="105" y="72" width="117" height="18" rx="9" fill="#0D0D18"/>
  <!-- Active "Місяць" pill -->
  <rect x="106" y="73" width="56" height="16" rx="8" fill="#8348C1"/>
  <text x="134" y="84.5" font-family="system-ui,-apple-system,sans-serif" font-size="7.5" font-weight="500" fill="white" text-anchor="middle">Місяць</text>
  <!-- Inactive "Рік" pill -->
  <text x="186" y="84.5" font-family="system-ui,-apple-system,sans-serif" font-size="7.5" fill="white" fill-opacity="0.45" text-anchor="middle">Рік</text>

  <!-- ============= CARD 1: Безкоштовно ============= -->
  <rect x="4" y="97" width="93" height="183" rx="10" fill="#050508"/>
  <rect x="4.4" y="97.4" width="92.2" height="182.2" rx="9.6" stroke="#522E8B" stroke-width="0.8" stroke-opacity="0.35"/>

  <text x="14" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="8" font-weight="500" fill="white" fill-opacity="0.75">Безкоштовно</text>
  <text x="14" y="133" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="300" fill="white">€0</text>
  <text x="40" y="133" font-family="system-ui,-apple-system,sans-serif" font-size="7" fill="white" fill-opacity="0.4">/місяць</text>

  <line x1="11" y1="140" x2="91" y2="140" stroke="url(#dividerGrad)" stroke-width="0.6"/>

  <circle cx="14" cy="151" r="2.2" fill="white" fill-opacity="0.7"/>
  <text x="19" y="154.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white" fill-opacity="0.75">Всі криптоактиви</text>
  <circle cx="14" cy="164" r="2.2" fill="white" fill-opacity="0.7"/>
  <text x="19" y="167.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white" fill-opacity="0.75">Demo Trading</text>
  <circle cx="14" cy="177" r="2.2" fill="white" fill-opacity="0.7"/>
  <text x="19" y="180.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white" fill-opacity="0.75">Бектестинг стратегій</text>
  <circle cx="14" cy="190" r="2.2" fill="white" fill-opacity="0.7"/>
  <text x="19" y="193.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white" fill-opacity="0.75">3 AI-сигнали/місяць</text>
  <circle cx="14" cy="203" r="2.2" fill="white" fill-opacity="0.7"/>
  <text x="19" y="206.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white" fill-opacity="0.75">Telegram-сповіщення</text>

  <!-- Free button -->
  <rect x="10" y="267" width="81" height="10" rx="5" fill="#050508" stroke="#522E8B" stroke-width="0.5" stroke-opacity="0.45"/>
  <text x="50.5" y="274.5" font-family="system-ui,-apple-system,sans-serif" font-size="5.5" font-weight="600" fill="white" fill-opacity="0.75" text-anchor="middle" letter-spacing="0.4">ПОЧАТИ ЗАРАЗ</text>

  <!-- ============= CARD 2: Pro (elevated) ============= -->
  <rect x="115" y="89" width="97" height="191" rx="10" fill="#0A0516"/>
  <rect x="115.4" y="89.4" width="96.2" height="190.2" rx="9.6" stroke="url(#proBorder)" stroke-width="0.8"/>
  <!-- Subtle top glow for pro -->
  <ellipse cx="163" cy="90" rx="40" ry="8" fill="#8348C1" fill-opacity="0.15"/>

  <!-- "Популярний" badge -->
  <rect x="161" y="97" width="43" height="12" rx="6" fill="transparent" stroke="#522E8B" stroke-width="0.6" stroke-opacity="0.6"/>
  <text x="182" y="105.5" font-family="system-ui,-apple-system,sans-serif" font-size="6" fill="#8348C1" text-anchor="middle">Популярний</text>

  <text x="125" y="113" font-family="system-ui,-apple-system,sans-serif" font-size="8" font-weight="500" fill="white">Про</text>
  <text x="125" y="133" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="300" fill="white">€9</text>
  <text x="151" y="133" font-family="system-ui,-apple-system,sans-serif" font-size="7" fill="white" fill-opacity="0.4">/місяць</text>

  <line x1="121" y1="140" x2="204" y2="140" stroke="url(#dividerGrad)" stroke-width="0.6"/>

  <text x="125" y="151" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white" fill-opacity="0.5">Все з Free, плюс:</text>

  <circle cx="125" cy="162" r="2.2" fill="white"/>
  <text x="130" y="165.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white">До 15 активів Watchlist</text>
  <circle cx="125" cy="175" r="2.2" fill="white"/>
  <text x="130" y="178.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white">Алерти для 5 активів</text>
  <circle cx="125" cy="188" r="2.2" fill="white"/>
  <text x="130" y="191.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white">100 PulseAI-запитів</text>
  <circle cx="125" cy="201" r="2.2" fill="white"/>
  <text x="130" y="204.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white">10 AI-сигналів/місяць</text>
  <circle cx="125" cy="214" r="2.2" fill="white"/>
  <text x="130" y="217.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white">Швидка підтримка</text>

  <!-- Pro button gradient -->
  <rect x="120" y="263" width="85" height="12" rx="6" fill="url(#proBtn)"/>
  <text x="162.5" y="271.5" font-family="system-ui,-apple-system,sans-serif" font-size="5.5" font-weight="600" fill="white" text-anchor="middle" letter-spacing="0.4">ПОЧАТИ ЗАРАЗ</text>

  <!-- ============= CARD 3: Преміум ============= -->
  <rect x="230" y="97" width="93" height="183" rx="10" fill="#050508"/>
  <rect x="230.4" y="97.4" width="92.2" height="182.2" rx="9.6" stroke="#522E8B" stroke-width="0.8" stroke-opacity="0.35"/>

  <text x="240" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="8" font-weight="500" fill="white" fill-opacity="0.75">Преміум</text>
  <text x="240" y="133" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="300" fill="white">€19</text>
  <text x="266" y="133" font-family="system-ui,-apple-system,sans-serif" font-size="7" fill="white" fill-opacity="0.4">/місяць</text>

  <line x1="237" y1="140" x2="317" y2="140" stroke="url(#dividerGrad)" stroke-width="0.6"/>

  <text x="240" y="151" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white" fill-opacity="0.5">Все з Про, плюс:</text>

  <circle cx="240" cy="162" r="2.2" fill="white" fill-opacity="0.7"/>
  <text x="245" y="165.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white" fill-opacity="0.75">Необмежений Watchlist</text>
  <circle cx="240" cy="175" r="2.2" fill="white" fill-opacity="0.7"/>
  <text x="245" y="178.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white" fill-opacity="0.75">Алерти для 15 активів</text>
  <circle cx="240" cy="188" r="2.2" fill="white" fill-opacity="0.7"/>
  <text x="245" y="191.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white" fill-opacity="0.75">Необмежені AI-сигнали</text>
  <circle cx="240" cy="201" r="2.2" fill="white" fill-opacity="0.7"/>
  <text x="245" y="204.5" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" fill="white" fill-opacity="0.75">Пріоритетна підтримка</text>

  <!-- Преміум button -->
  <rect x="236" y="267" width="81" height="10" rx="5" fill="#050508" stroke="#522E8B" stroke-width="0.5" stroke-opacity="0.45"/>
  <text x="276.5" y="274.5" font-family="system-ui,-apple-system,sans-serif" font-size="5.5" font-weight="600" fill="white" fill-opacity="0.75" text-anchor="middle" letter-spacing="0.4">ПОЧАТИ ЗАРАЗ</text>
</svg>
